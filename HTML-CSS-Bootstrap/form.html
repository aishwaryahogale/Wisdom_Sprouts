<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
</head>
<body>
    
<form  align="center">
    <label for="nameInput">Enter your name</label>
    <input type="text" id="nameInput" placeholder="enter your name">
    <br>
    <label for="ageInput">Enter age</label>
    <input type="number" id="ageInput" value="100">
    <br>
    <label for="fileInput">Upload a file</label>
    <input type="file" id="fileInput">
    <br>
    <label for="marksInput">enter your Marks</label>
    <input type="number" id="marksInput">
    <br>
    <label for="birthDateInput">BirthDate</label>
    <input type="date" id="birthDateInput">
    <br>
    <label for="emailInput">Enter your Email</label>
    <input type="email" name="email" id="emailInput">
    <br>
    <label for="passinput">Enter your password </label>
    <input type="password" value="pass" id="passinput">

    <button>Register</button>
    <input type="submit" value="REGISTER">
<input type="reset">

</form>




</body>
</html>
